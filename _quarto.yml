project:
  type: website
  output-dir: docs
  resources:
    - images/psdv_logo.svg

website:
  site-url: "https://nipunbatra.github.io/psdv25"
  title: "ES 114 · Probability, statistics and data visualization"
  description: "Probability, statistics and data visualization at IIT Gandhinagar, January 2025"
  favicon: images/psdv_favicon.svg
  navbar:
    title: "ES 114 · PSDV"
    right:
      - href: index.qmd
        text: Home
      - href: lectures.qmd
        text: Lectures
      - href: grading.qmd
        text: Grading
      - href: faq.qmd
        text: FAQ
      - href: tentative.qmd
        text: Deadlines
      - href: videos/videos.qmd
        text: Expositions
      - href: https://nipunbatra.github.io
        text: Instructor
  page-footer:
    left: "ES 114 Probability, statistics and data visualization · IIT Gandhinagar · January 2025"
