project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - schedule.qmd
    - assessment.qmd
    - exposition.qmd
    - videos/videos.qmd
    - faq.qmd
    - slides/transformation.ipynb
    - lectures.qmd
    - grading.qmd
    - tentative.qmd
  resources:
    - "slides/*.pdf"

website:
  title: "ES 114 · Probability, Statistics and Data Visualization"
  favicon: favicon.svg
  description: "Probability, Statistics and Data Visualization at IIT Gandhinagar"
  site-url: https://nipunbatra.github.io/psdv25/
  search: false

format:
  html:
    theme: [cosmo, styles.scss, course.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    body-classes: dl
    link-external-newwindow: true
    include-in-header: course-theme.html
    include-before-body: rail.html
    include-after-body: course-tools.html

execute:
  freeze: auto
