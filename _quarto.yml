format:
  html:
    from: markdown-smart
    theme:
      light: [cosmo, nb-course.scss]
      dark: [darkly, nb-course.scss]
    toc: false
    page-layout: full
    smooth-scroll: false
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    fig-responsive: true

execute:
  freeze: auto
